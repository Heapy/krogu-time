name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60

    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.4"

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-macos-26-${{ runner.arch }}-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: |
            kotlin-toolchain-macos-26-${{ runner.arch }}-

      - name: Run tests
        run: ./kotlin test

      - name: Build all targets
        run: ./kotlin build
