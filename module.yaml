product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, iosX64]

aliases:
  - jvmAndAndroid: [jvm, android]

description: A Kotlin Multiplatform port of java.time

settings:
  android:
    namespace: io.heapy.krogu.time
  # Two separate knobs. `jdk.version` is the JDK that compiles the code and runs
  # the JVM differential tests, so it sets the behavioral reference of this port:
  # JDK 25 java.time. `release` stays at 21 so the published bytecode is
  # class-file 65 and still loads on a Java 21 JVM.
  jvm:
    jdk:
      version: 25
    release: 21
  publishing:
    enabled: true
    group: io.heapy
    artifactId: krogu-time
    version: 0.1.0
    publishSources: true
    signArtifacts: true
    mavenCentral:
      enabled: true
      publishingMode: manual
    pom:
      name: krogu-time
      description: A Kotlin Multiplatform port of the Java 25 java.time API
      url: https://github.com/heapy/krogu-time
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: heapy
          name: Ruslan Ibrahimau
      scm:
        url: https://github.com/heapy/krogu-time
        connection: scm:git:https://github.com/heapy/krogu-time.git
        developerConnection: scm:git:ssh://git@github.com/heapy/krogu-time.git

# allWarningsAsErrors is applied per leaf platform, not in common.
# The publication metadata compilation (compileMetadataIos) hits a
# kotlin-stdlib KLIB loader warning about a duplicated unique_name that no
# project code can fix, and -Werror there blocks `kotlin publish`. Every
# common source file is still compiled by each leaf platform, so project
# warnings remain errors.
settings@jvm:
  kotlin:
    allWarningsAsErrors: true

settings@android:
  kotlin:
    allWarningsAsErrors: true

settings@iosArm64:
  kotlin:
    allWarningsAsErrors: true

settings@iosSimulatorArm64:
  kotlin:
    allWarningsAsErrors: true

settings@iosX64:
  kotlin:
    allWarningsAsErrors: true

# The published bytecode targets class-file 65 (`release: 21`), but the JVM
# differential tests must see the full JDK 25 API to compare against it.
test-settings:
  jvm:
    release: 25
